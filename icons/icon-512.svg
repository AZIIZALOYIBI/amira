<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ea8862"/>
      <stop offset="55%" stop-color="#93462e"/>
      <stop offset="100%" stop-color="#181614"/>
    </radialGradient>
    <linearGradient id="king" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf1df"/>
      <stop offset="100%" stop-color="#ebdbbc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- subtle board grid -->
  <g opacity="0.15" fill="#fbf1df">
    <rect x="64"  y="352" width="48" height="48"/>
    <rect x="160" y="352" width="48" height="48"/>
    <rect x="256" y="352" width="48" height="48"/>
    <rect x="352" y="352" width="48" height="48"/>
    <rect x="112" y="400" width="48" height="48"/>
    <rect x="208" y="400" width="48" height="48"/>
    <rect x="304" y="400" width="48" height="48"/>
    <rect x="400" y="400" width="48" height="48"/>
  </g>
  <!-- stylised king glyph -->
  <g filter="url(#glow)" fill="url(#king)">
    <path d="M256 96 l14 28 l30 4 l-22 20 l6 30 l-28 -14 l-28 14 l6 -30 l-22 -20 l30 -4 z"/>
    <rect x="232" y="176" width="48" height="14" rx="4"/>
    <path d="M200 198 h112 l-14 120 q-4 24 -28 24 h-28 q-24 0 -28 -24 z"/>
    <rect x="184" y="326" width="144" height="22" rx="6"/>
